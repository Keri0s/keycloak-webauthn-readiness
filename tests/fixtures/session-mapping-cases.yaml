evidence_policy:
  permitted: ['Mã ca/biến thể, thời điểm và môi trường chạy.', Tham chiếu không bí mật của user/group/binding và
      kết quả ALLOW/DENY., 'Kết quả so sánh key trước/sau, số binding, trạng thái thu hồi và thứ tự sự kiện.']
  prohibited: ['Cookie, session_key thật, access/refresh/ID/logout token nguyên văn.', 'Mật khẩu, Windows PIN hoặc
      khóa riêng.']
  required_when_executed: [Phiên bản mã nguồn hoặc commit/hash., Expected và observed riêng biệt., Log đã loại bí
      mật và giới hạn thực tế.]
cases:
- id: A1
  title: Tạo liên kết đúng sau đăng nhập hợp lệ
  fixture_set: identity_only
  login_context: verified_login_u1_s01
  steps:
  - {order: 1, action: COMPLETE_VERIFIED_LOGIN, output_session_ref: D-NEW}
  - order: 2
    action: CHECK_PROTECTED_ACCESS
    session_refs: [D-NEW]
  expected:
    new_group_count: 1
    new_binding_count: 1
    binding_matches: {issuer_id: KC-A, client_id: app-lab, subject: SUB-A-U1, sid: S01, user_id: U1, django_session_ref: D-NEW}
    access: {D-NEW: ALLOW}
    resolved_user: {D-NEW: U1}
  evidence_required: [Kết quả đối chiếu các trường binding., Kết quả truy cập và user được nhận diện.]
  execution:
    status: NOT_RUN
    observed: null
    evidence: []
    executed_at: null
- id: A2
  title: Binding dùng mã phiên sau rotation
  fixture_set: anonymous_login
  login_context: verified_login_u1_s01
  steps:
  - {order: 1, action: COMPLETE_VERIFIED_LOGIN_WITH_SESSION_ROTATION, input_session_ref: D-TEMP, output_session_ref: D-NEW}
  - order: 2
    action: CHECK_PROTECTED_ACCESS
    session_refs: [D-TEMP, D-NEW]
  expected:
    session_key_rotated: true
    active_binding_session_refs: [D-NEW]
    active_binding_count_for_old_session: 0
    access: {D-TEMP: DENY, D-NEW: ALLOW}
    focus: 'Chống session fixation: so sánh key trước/sau và binding dùng key cuối cùng; DENY phiên anonymous riêng
      lẻ chưa chứng minh rotation đúng.'
  evidence_required: [So sánh nội bộ xác nhận key trước và sau khác nhau; không xuất key thật., Binding chỉ liên
      kết phiên cuối cùng; kiểm quyền bằng phiên cũ/mới.]
  execution:
    status: NOT_RUN
    observed: null
    evidence: []
    executed_at: null
- id: A3
  title: Thu hồi không lan sang phiên Keycloak khác của cùng user
  fixture_set: active_sessions
  revocation_context: verified_revocation_a_s01
  steps:
  - {action: REVOKE_VERIFIED_GROUP_AND_COMMIT, order: 1}
  - action: CHECK_DJANGO_SESSION_STORAGE
    session_refs: [D01, D02, D03, D04, D05]
    order: 2
  - action: CHECK_PROTECTED_ACCESS
    session_refs: [D01, D02, D03, D04, D05]
    order: 3
  expected:
    revoked_binding_ids: [B01, B02]
    active_binding_ids: [B03, B04, B05]
    access: {D01: DENY, D02: DENY, D03: ALLOW, D04: ALLOW, D05: ALLOW}
    focus: D03 thuộc cùng U1 nhưng khác sid, phải tiếp tục truy cập được.
    django_session_states: {D01: INVALIDATED, D02: INVALIDATED, D03: AUTHENTICATED, D04: AUTHENTICATED, D05: AUTHENTICATED}
  evidence_required: ['Binding bị thu hồi, binding đối chứng và kết quả request sau commit.', Probe Django backend
      bằng phiên cũ và kiểm danh tính phiên đối chứng; không chỉ kiểm binding REVOKED.]
  execution:
    status: PASS
    observed:
      before_http: {D01: 200, D02: 200, D03: 200, D04: 200, D05: 200}
      django_session_states: {D01: INVALIDATED, D02: INVALIDATED, D03: AUTHENTICATED, D04: AUTHENTICATED, D05: AUTHENTICATED}
      after_commit_http: {D01: 403, D02: 403, D03: 200, D04: 200, D05: 200}
      probe_data_cleaned: true
    evidence:
    - 'Ảnh đầu ra PowerShell do người thực hiện cung cấp. Windows, Python 3.12.10, Django 5.2.19, PostgreSQL.'
    - 'Script tmp/check_a3_a5.py. Source bundle SHA256 07864b1f30abb8a6eb74d444b276ef037b361d1d7a8e5728e659fcd82730449f.'
    - 'Django service nhận ngữ cảnh đã xác minh. Hai issuer là dữ liệu giả định. Kiểm backend và /private/ sau commit.'
    executed_at: '2026-11-16T17:27:17.242992+00:00'
