execution_aggregation:
  leaf_statuses: [NOT_RUN, IN_PROGRESS, PASS, FAIL, BLOCKED]
  rule_precedence:
  - {when: ANY_CHILD_FAIL, result: FAIL}
  - {when: ANY_CHILD_IN_PROGRESS, result: IN_PROGRESS}
  - {when: ANY_CHILD_BLOCKED, result: BLOCKED}
  - {when: ALL_CHILDREN_PASS, result: PASS}
  - {when: ALL_CHILDREN_NOT_RUN, result: NOT_RUN}
  - {when: OTHER_MIX_OF_PASS_AND_NOT_RUN, result: IN_PROGRESS}
  parent_policy: Trạng thái suite/ca có variants được suy ra đệ quy; không lưu status, observed hoặc executed_at
    độc lập tại cha.
concurrency_requirements:
  database: PostgreSQL
  harness: Django TransactionTestCase hoặc tương đương có real commit/rollback
  independent_connections_per_actor: true
  minimum_connections: 2
  deterministic_barriers: true
  barrier_placement: Dừng actor trước khi lấy write guard/lock để điều khiển thứ tự commit; không giữ lock rồi chờ
    actor cần chính lock đó.
  not_proof: [TestCase bọc transaction ngoài, SQLite, Một connection chạy tuần tự, Chỉ đổi thứ tự list bước, Sleep/bấm
      nhanh]
  storage_probe: Đọc lại từ database/session backend sau commit; không dùng object/cache cũ để kết luận.
  required_evidence: ['Database vendor, isolation và transaction boundaries', 'Connection/actor khác nhau, barrier
      và commit trace', Backend session probe và request mới sau thu hồi]

