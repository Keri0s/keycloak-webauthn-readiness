# YAML 1.2 — đặc tả kiểm chứng v1.2
schema_version: '1.2'
suite_id: SESSION_MAPPING_A
title: Kiểm chứng ánh xạ phiên Keycloak và Django
created_on: '2026-11-15'
language: vi
design_reference: ../../docs/lab-decisions.md
design_issue: A
invariant_contract:
  version: '1.1'
  document: ../../docs/lab-decisions.md
  decision: D08
  invariant_ids: [INV-A01, INV-A02, INV-A03, INV-A04, INV-A05, INV-A06, INV-A07, INV-A08]
  coverage_status: PARTIAL_IN_PROGRESS
requirement_refs: [FR-05, D05]
workflow_tasks: [P3-T1, P3-T2, P3-T3]
scope:
  level: TEST_DESIGN_SPECIFICATION
  synthetic_data: true
  executable_runner_available: false
  description: Đặc tả dữ liệu giả định, chưa có runner. Có thể kiểm tra logic trước; chỉ chạy mô hình trong bộ nhớ
    không đủ nghiệm thu invalidation của Django backend hoặc concurrency. B/C vẫn phải kiểm chứng giao thức riêng.
  session_reference_policy: D01, D-TEMP, D-NEW và các mã tương tự là tham chiếu phiên giả định, không phải cookie
    hoặc session_key thật. Khi kiểm thử Django thực tế, so sánh key nội bộ rồi chỉ ghi kết quả so sánh đã loại bí
    mật.
  authorization_results: {ALLOW: Được truy cập tài nguyên được bảo vệ trong phạm vi ca kiểm tra., DENY: Không được
      truy cập; mã HTTP/redirect sẽ xác định ở kiểm thử tích hợp.}
  minimum_acceptance_level: DJANGO_POSTGRESQL_INTEGRATION
  resolved_user_semantics: resolved_user là danh tính hiệu lực được lớp kiểm quyền chấp nhận, không đồng nghĩa giá
    trị request.user nội bộ.
  django_session_state_semantics:
    AUTHENTICATED: Backend vẫn nạp được danh tính đã đăng nhập của phiên đối chứng.
    INVALIDATED: 'Backend không còn nạp được danh tính đăng nhập từ mã phiên cũ: record bị xóa hoặc auth data đã
      bị hủy. Chỉ binding REVOKED hoặc request DENY là chưa đủ.'
    NO_AUTHENTICATED_SESSION: Không có phiên được cấp quyền đăng nhập; record anonymous còn tồn tại không tự làm
      ca thất bại.
  unknown_identity_policy: Catalog là allowlist danh tính của bộ ca; không JIT provisioning và không tự liên kết
    theo email. Đây là chính sách lab đang thiết kế, không phải yêu cầu chung của OIDC.
  step_context_override: login_context_override trên step thay login_context của ca cho đúng step đó; issuer_id/client_id
    tham chiếu catalog.
isolation:
  reset_before_each_case: true
  reset_before_each_variant: true
  fixtures_are_deep_copied: true
  use_real_vdt_data: false
  description: Mỗi ca/biến thể bắt đầu từ fixture riêng, không dùng kết quả ca trước.
preconditions: [Các phiên trong fixture chưa hết hạn; clock được kiểm soát., Tài nguyên kiểm tra yêu cầu phiên và
    binding còn hiệu lực., 'User và issuer được đối chiếu bằng ExternalIdentity, không tự ghép theo email.', Ngữ
    cảnh đăng nhập/thu hồi ghi là VERIFIED chỉ mô phỏng đầu ra đã xác minh. Bộ ca này không thực hiện xác minh chữ
    ký/token; phần đó thuộc B và tích hợp.]
catalog:
  clients:
  - {id: app-lab}
  - {id: app-other}
  issuers:
  - {id: KC-A, value: 'https://auth.readiness.test:9443/realms/issuer-a'}
  - {id: KC-B, value: 'https://auth.readiness.test:9443/realms/issuer-b'}
  users:
  - {id: U1, email: u1@example.test}
  - {id: U2, email: u2@example.test}
  external_identities:
  - {issuer_id: KC-A, subject: SUB-A-U1, user_id: U1}
  - {issuer_id: KC-A, subject: SUB-A-U2, user_id: U2}
  - {issuer_id: KC-B, subject: SUB-B-U2, user_id: U2}
  description: Hai issuer là dữ liệu logic giả định, chưa phải hai realm đã được dựng. Danh tính U2 ở hai issuer
    được khai báo sẵn cho fixture, không minh họa tự động liên kết tài khoản bằng email. Mã issuer_id phải được
    đối chiếu qua catalog. Hai client cũng là dữ liệu kiểm phạm vi, không phải yêu cầu dựng thêm client thật. Email
    chỉ là thuộc tính đối chứng.
fixture_sets:
