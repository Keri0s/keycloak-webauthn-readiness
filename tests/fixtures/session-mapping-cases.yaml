- id: A6
  title: Callback và logout đồng thời không làm hồi sinh phiên
  fixture_set: pending_callback
  login_context: verified_login_u1_s01
  revocation_context: verified_revocation_a_s01
  synchronization:
    method: DETERMINISTIC_BARRIERS
    description: Dừng actor trước khi lấy write guard/lock để điều khiển thứ tự commit; không giữ lock rồi chờ actor
      cần chính lock đó.
  variants:
  - id: A6a
    title: Callback commit trước, logout commit sau
    steps:
    - {order: 1, actor: CALLBACK, action: VERIFY_LOGIN_AND_PAUSE_BEFORE_SESSION_WRITE_GUARD}
    - {order: 2, actor: LOGOUT, action: VERIFY_REVOCATION_AND_PAUSE_BEFORE_SESSION_WRITE_GUARD}
    - {order: 3, actor: CALLBACK, action: CREATE_BINDING_AND_COMMIT, output_session_ref: D-NEW}
    - {order: 4, actor: LOGOUT, action: REVOKE_VERIFIED_GROUP_AND_COMMIT}
    - actor: PROBE
      action: CHECK_DJANGO_SESSION_STORAGE
      session_refs: [D-NEW]
      order: 5
    - order: 6
      actor: REQUEST
      action: CHECK_PROTECTED_ACCESS
      session_refs: [D-PENDING, D-NEW]
    expected:
      group_state: REVOKED
