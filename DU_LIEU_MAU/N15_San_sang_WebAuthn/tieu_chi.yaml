phien_ban: 0.1-mau
ghi_chu: Thang mẫu 16 tiêu chí, 4 nhóm. Căn cứ ghi ở mức chương/mục; nhóm đối chiếu
  mục cụ thể của phiên bản chuẩn đang dùng [CẦN KIỂM CHỨNG].
